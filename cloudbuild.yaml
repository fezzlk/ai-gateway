substitutions:
  _SERVICE_NAME: "ai-gateway"
  _REGION: "asia-northeast1"
  _REGISTRY: "asia-northeast1-docker.pkg.dev/${PROJECT_ID}/ai-gateway"
  # Non-secret but personal (Tailscale hostname of your Mac, SSH user, and
  # the Mac's SSH host-key line for pinning). Set the real values on the
  # Cloud Build trigger's substitutions, never here, so this file stays
  # generic/public per this repo's own design policy.
  _MAC_SSH_HOST: ""
  _MAC_SSH_USER: ""
  _MAC_SSH_KNOWN_HOST_LINE: ""
  # LINE userId authorized to trigger board.py writes via /line/webhook
  # postbacks (see routes/line_webhook.py). Same "non-secret but personal,
  # real value only on the trigger" treatment as the MAC_SSH_* vars above.
  _LINE_AUTHORIZED_USER_ID: ""
  # Whether the setpriority LINE postback (and any SSH-injected Linear MCP
  # write) is permitted to write to Linear. Non-secret opt-in flag, real
  # value only on the trigger, same treatment as the vars above.
  _LINEAR_WRITE_ALLOWED: ""
  # Web authentication and per-environment executor availability.
  _AUTH_MODE: "shared_token"
  _ACCESS_MODE: "private"
  _GOOGLE_OAUTH_CLIENT_ID: ""
  _LINE_LOGIN_CHANNEL_ID: ""
  _AUTHORIZED_GOOGLE_EMAILS: ""
  _AUTHORIZED_LINE_USER_IDS: ""
  _EXECUTION_ENABLED: "true"
  _CLAUDE_ENABLED: "true"
  _CODEX_ENABLED: "false"
  _GCP_VM_ENABLED: "false"
  # Absolute path to `claude` on the Mac. Non-interactive SSH commands only
  # source ~/.zshenv (not ~/.zshrc), so a PATH built by .zshrc — e.g. via
  # nvm or a user-local bin dir — won't be visible; an absolute path sidesteps
  # that instead of requiring shell-config changes on the Mac.
  _CLAUDE_BIN: "claude"
  # Tools Claude may run without an interactive approval prompt (there is
  # none over non-interactive SSH). Adjust the mcp__*__* entries to match
  # whichever MCP servers are configured on your own Mac.
  _CLAUDE_ALLOWED_TOOLS: "Bash,Read,Edit,mcp__linear__*,mcp__github__*,mcp__github-actions__*"

steps:
  - id: "build"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGISTRY}/app:${SHORT_SHA}"
      - "-t"
      - "${_REGISTRY}/app:latest"
      - "."

  - id: "push"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_REGISTRY}/app"
    waitFor: ["build"]

  # --timeout=3600 (Cloud Run's max) is intentional, not an oversight: a
  # headless Claude Code/Codex run over SSH can legitimately take minutes,
  # and Cloud Run kills a request at its own timeout regardless of what the
  # app is doing. Billing is per actual request duration, not this cap.
  - id: "deploy"
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=${_REGISTRY}/app:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=3"
      - "--timeout=3600"
      - "--service-account=ai-gateway-run@$PROJECT_ID.iam.gserviceaccount.com"
      # CLAUDE_ALLOWED_TOOLS' value contains commas (mcp__*__* entries are
      # comma-separated), which collides with --set-env-vars' default
      # delimiter, so the delimiter is switched to "@" (gcloud's
      # "^delim^..." syntax) for this flag.
      - "--set-env-vars=^@^MAC_SSH_HOST=${_MAC_SSH_HOST}@MAC_SSH_USER=${_MAC_SSH_USER}@MAC_SSH_KNOWN_HOST_LINE=${_MAC_SSH_KNOWN_HOST_LINE}@CLAUDE_BIN=${_CLAUDE_BIN}@CLAUDE_ALLOWED_TOOLS=${_CLAUDE_ALLOWED_TOOLS}@LINE_AUTHORIZED_USER_ID=${_LINE_AUTHORIZED_USER_ID}@LINEAR_WRITE_ALLOWED=${_LINEAR_WRITE_ALLOWED}@AUTH_MODE=${_AUTH_MODE}@ACCESS_MODE=${_ACCESS_MODE}@GOOGLE_OAUTH_CLIENT_ID=${_GOOGLE_OAUTH_CLIENT_ID}@LINE_LOGIN_CHANNEL_ID=${_LINE_LOGIN_CHANNEL_ID}@AUTHORIZED_GOOGLE_EMAILS=${_AUTHORIZED_GOOGLE_EMAILS}@AUTHORIZED_LINE_USER_IDS=${_AUTHORIZED_LINE_USER_IDS}@EXECUTION_ENABLED=${_EXECUTION_ENABLED}@CLAUDE_ENABLED=${_CLAUDE_ENABLED}@CODEX_ENABLED=${_CODEX_ENABLED}@GCP_VM_ENABLED=${_GCP_VM_ENABLED}"
      - "--set-secrets=AI_GATEWAY_SHARED_TOKEN=AI_GATEWAY_SHARED_TOKEN:latest,SESSION_SECRET=SESSION_SECRET:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest,LINE_LOGIN_CHANNEL_SECRET=LINE_LOGIN_CHANNEL_SECRET:latest,TAILSCALE_AUTHKEY=TAILSCALE_AUTHKEY:latest,CLAUDE_CODE_OAUTH_TOKEN=CLAUDE_CODE_OAUTH_TOKEN:latest,GITHUB_PERSONAL_ACCESS_TOKEN=GITHUB_PERSONAL_ACCESS_TOKEN:latest,/secrets/mac_ssh_key=MAC_SSH_PRIVATE_KEY:latest,LINE_CHANNEL_SECRET=LINE_CHANNEL_SECRET:latest,LINE_CHANNEL_ACCESS_TOKEN=LINE_CHANNEL_ACCESS_TOKEN:latest,LINEAR_API_KEY=LINEAR_API_KEY:latest"
    waitFor: ["push"]

  - id: "smoke-test"
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        SERVICE_URL=$(gcloud run services describe ${_SERVICE_NAME} \
          --region=${_REGION} --format='value(status.url)')
        echo "Smoke testing: $${SERVICE_URL}/health"
        for i in 1 2 3 4 5; do
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$${SERVICE_URL}/health")
          if [ "$$STATUS" = "200" ]; then
            echo "Health check passed (attempt $$i)"
            exit 0
          fi
          echo "Attempt $$i: got $$STATUS, retrying in 5s..."
          sleep 5
        done
        echo "Smoke test failed after 5 attempts"
        exit 1
    waitFor: ["deploy"]

images:
  - "${_REGISTRY}/app:${SHORT_SHA}"
  - "${_REGISTRY}/app:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
